[project]
name = "musicmigration"
version = "0.1.0"
description = "Personal script for migrating playcount metatadata off apple music to navidrome via excel"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "py-opensonic>=11.0.0",
]

[project.scripts]
musicmigration = "musicmigration:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.4",
    "pytest>=9.2.0",
]
